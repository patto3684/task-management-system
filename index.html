<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            boxShadow: {
              soft: '0 10px 30px rgba(15, 23, 42, 0.08)',
            }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800">
    <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <header class="rounded-2xl border border-slate-200 bg-white shadow-soft">
        <div class="flex flex-col gap-4 px-6 py-5 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p class="text-sm font-medium uppercase tracking-[0.2em] text-sky-600">Workspace</p>
            <h1 class="mt-2 text-3xl font-bold text-slate-900">Task Management System</h1>
          </div>
          <button
            id="openCreateTaskBtn"
            type="button"
            class="inline-flex items-center justify-center rounded-xl bg-sky-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-600/20 transition hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2"
          >
            + Create Task
          </button>
        </div>
      </header>

      <section class="mt-6 rounded-2xl border border-slate-200 bg-white p-4 shadow-soft">
        <div class="flex flex-wrap gap-3">
          <button type="button" data-filter="All" class="filter-btn rounded-full bg-sky-100 px-4 py-2 text-sm font-semibold text-sky-700 ring-1 ring-sky-200 transition hover:bg-sky-200">
            All
          </button>
          <button type="button" data-filter="Pending" class="filter-btn rounded-full bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-200">
            Pending
          </button>
          <button type="button" data-filter="Completed" class="filter-btn rounded-full bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-200">
            Completed
          </button>
        </div>
      </section>

      <main class="mt-8">
        <div id="taskList" class="grid gap-5 md:grid-cols-2 xl:grid-cols-3"></div>
      </main>
    </div>

    <div id="taskModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 px-4 py-6">
      <div class="w-full max-w-2xl rounded-2xl bg-white p-6 shadow-2xl">
        <div class="mb-5 flex items-center justify-between">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-500">Task</p>
            <h2 id="modalTitle" class="mt-1 text-2xl font-bold text-slate-900">Create Task</h2>
          </div>
          <button id="closeModalBtn" type="button" class="rounded-full border border-slate-200 p-2 text-slate-500 transition hover:bg-slate-100">✕</button>
        </div>

        <form id="taskForm" class="space-y-5">
          <input id="taskId" type="hidden" name="id" />

          <div>
            <label for="title" class="mb-2 block text-sm font-medium text-slate-700">Title</label>
            <input
              id="title"
              name="title"
              type="text"
              placeholder="Enter task title"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-slate-800 outline-none transition focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-100"
              required
            />
          </div>

          <div>
            <label for="description" class="mb-2 block text-sm font-medium text-slate-700">Description</label>
            <textarea
              id="description"
              name="description"
              rows="4"
              placeholder="Add task details"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-slate-800 outline-none transition focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-100"
            ></textarea>
          </div>

          <div class="grid gap-5 md:grid-cols-2">
            <div>
              <label for="status" class="mb-2 block text-sm font-medium text-slate-700">Status</label>
              <select id="status" name="status" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-slate-800 outline-none transition focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-100">
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
              </select>
            </div>

            <div>
              <label for="priority" class="mb-2 block text-sm font-medium text-slate-700">Priority</label>
              <select id="priority" name="priority" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-slate-800 outline-none transition focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-100">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
            </div>
          </div>

          <div class="flex items-center justify-end gap-3 pt-2">
            <button id="cancelTaskBtn" type="button" class="rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-100">
              Cancel
            </button>
            <button type="submit" class="rounded-xl bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-sky-600/20 transition hover:bg-sky-700">
              Save Task
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="./assets/js/app.js"></script>
  </body>
</html>
